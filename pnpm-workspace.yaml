# pnpm blocks dependencies' install scripts by default; esbuild needs its platform binary for vitest.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - "@wirecat/*"
# markdownlint-cli2 is pinned to community's version, whose markdownlint ranges katex ^0.16 with advisories.
overrides:
  "@wirecat/cli-core": file:/var/tmp/claude/claude-1000/-home-leemour-Projects-AI-cli-template/dea9073e-ae20-4c9e-9afb-f068dda7cf8e/scratchpad/core-pack/wirecat-cli-core-0.688.0.tgz
  "@wirecat/cli-base": 0.109.0
  katex: ^0.18.2
  # markdownlint 0.42.0 (its latest) pins re2js 2.8.6 exactly (GHSA-gg6h-894w-4m9c).
  markdownlint>re2js: 2.8.7
